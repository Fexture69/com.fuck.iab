name: Build APK

on:
  push:
    branches: [ dev, main, 'feat/**', 'fix/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Source build of the gumjs devkit linked into libnativehook.so. Frida's own
  # prebuilt devkit includes V8, which is why build-frida-gum.sh builds a diet
  # QuickJS-only devkit from a frida-gum checkout instead.
  GUM_VERSION: "17.24.3"
  # frida-gum 17.x requires NDK r29; the app itself builds with r30.
  GUM_NDK_VERSION: "29.0.14206865"
  NDK_VERSION: "30.0.16248370"
  CMAKE_VERSION: "3.22.1"

jobs:
  apk:
    name: Build FKIAB
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.naming.outputs.version }}
      has_release: ${{ steps.check-secrets.outputs.has_keystore }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;$NDK_VERSION" "ndk;$GUM_NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Cache frida-gum devkit
        id: frida-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/libs
          key: frida-gum-${{ env.GUM_VERSION }}-${{ hashFiles('build-frida-gum.sh') }}

      - name: Build frida-gum devkit
        if: steps.frida-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}/ndk/$GUM_NDK_VERSION"
          echo "NDK: $ANDROID_NDK_ROOT"
          git clone --depth 1 --branch "$GUM_VERSION" --recurse-submodules \
            https://github.com/frida/frida-gum.git frida-gum
          bash ./build-frida-gum.sh frida-gum .
          du -sh app/src/main/libs/*

      - name: Check devkit files
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            test -f "app/src/main/libs/$abi/libfrida-gumjs.a" \
              || { echo "missing libfrida-gumjs.a for $abi"; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Build scripts into APK assets
        working-directory: scripts
        run: |
          npm ci
          npm run build:all

      - name: Verify packaged Frida scripts
        run: |
          test -s app/src/main/assets/scripts/global.js
          test -s app/src/main/assets/scripts/com.life360.android.safetymapd.js
          test -s app/src/main/assets/scripts/com.adguard.android.js

      - name: Check signing secrets availability
        id: check-secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore detected."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore detected, building debug APKs only."
          fi

      - name: Decode signing keystore
        if: steps.check-secrets.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/fkiab-ci.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

          {
            echo "KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Grant execution permission
        run: chmod +x ./gradlew

      - name: Build APKs
        run: |
          if [ "${{ steps.check-secrets.outputs.has_keystore }}" = "true" ]; then
            ./gradlew assembleDebug assembleRelease --console=plain
          else
            ./gradlew assembleDebug --console=plain
          fi

      - name: Verify release APK signatures
        if: steps.check-secrets.outputs.has_keystore == 'true'
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)"
          EXPECTED_SHA256="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | grep -m 1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"

          for apk in app/build/outputs/apk/release/*-release.apk; do
            SIGNED_SHA256="$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk" \
              | grep -m 1 'SHA-256 digest' | awk '{print $NF}' | tr 'A-F' 'a-f')"
            if [ "$SIGNED_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::$apk is not signed with the repository key (got $SIGNED_SHA256, expected $EXPECTED_SHA256)."
              exit 1
            fi
            echo "signed: $apk"
          done

      - name: Name the APKs
        id: naming
        run: |
          set -euo pipefail

          VERSION="$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p dist/release dist/debug

          if [ -d app/build/outputs/apk/release ]; then
            for apk in app/build/outputs/apk/release/*.apk; do
              [ -e "$apk" ] || continue
              abi="$(basename "$apk" .apk)"
              abi="${abi#app-}"
              abi="${abi%-release}"
              cp "$apk" "dist/release/com.fuck.iab-v$VERSION-$abi.apk"
            done
          fi

          if [ -d app/build/outputs/apk/debug ]; then
            for apk in app/build/outputs/apk/debug/*.apk; do
              [ -e "$apk" ] || continue
              abi="$(basename "$apk" .apk)"
              abi="${abi#app-}"
              abi="${abi%-debug}"
              cp "$apk" "dist/debug/com.fuck.iab-v$VERSION-debug-$abi.apk"
            done
          fi

          ls -l dist/release dist/debug || true

      # Upload debug APKs
      - name: Upload debug arm64 apk
        uses: actions/upload-artifact@v4
        with:
          name: com.fuck.iab-v${{ steps.naming.outputs.version }}-debug-arm64-v8a
          path: dist/debug/com.fuck.iab-v${{ steps.naming.outputs.version }}-debug-arm64-v8a.apk
          if-no-files-found: warn

      - name: Upload debug armeabi-v7a apk
        uses: actions/upload-artifact@v4
        with:
          name: com.fuck.iab-v${{ steps.naming.outputs.version }}-debug-armeabi-v7a
          path: dist/debug/com.fuck.iab-v${{ steps.naming.outputs.version }}-debug-armeabi-v7a.apk
          if-no-files-found: warn

      - name: Upload debug universal apk
        uses: actions/upload-artifact@v4
        with:
          name: com.fuck.iab-v${{ steps.naming.outputs.version }}-debug-universal
          path: dist/debug/com.fuck.iab-v${{ steps.naming.outputs.version }}-debug-universal.apk
          if-no-files-found: warn

      # Upload release APKs (if signed)
      - name: Upload release arm64 apk
        if: steps.check-secrets.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: com.fuck.iab-v${{ steps.naming.outputs.version }}-arm64-v8a
          path: dist/release/com.fuck.iab-v${{ steps.naming.outputs.version }}-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload release armeabi-v7a apk
        if: steps.check-secrets.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: com.fuck.iab-v${{ steps.naming.outputs.version }}-armeabi-v7a
          path: dist/release/com.fuck.iab-v${{ steps.naming.outputs.version }}-armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload release universal apk
        if: steps.check-secrets.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: com.fuck.iab-v${{ steps.naming.outputs.version }}-universal
          path: dist/release/com.fuck.iab-v${{ steps.naming.outputs.version }}-universal.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v') && needs.apk.outputs.has_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: com.fuck.iab-v${{ needs.apk.outputs.version }}-arm64-v8a
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: com.fuck.iab-v${{ needs.apk.outputs.version }}-armeabi-v7a
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: com.fuck.iab-v${{ needs.apk.outputs.version }}-universal
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
