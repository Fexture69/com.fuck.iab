name: Build APK

on:
  push:
    branches: [ dev, main, 'feat/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Source build of the gumjs devkit linked into libnativehook.so. Frida's own
  # prebuilt devkit includes V8, which is why build-frida-gum.sh builds a diet
  # QuickJS-only devkit instead.
  FRIDA_VERSION: "17.24.3"
  NDK_VERSION: "30.0.16248370"
  CMAKE_VERSION: "3.22.1"

jobs:
  apk:
    name: Build FKIAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Cache frida-gum devkit
        id: frida-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/libs
          key: frida-gum-${{ env.FRIDA_VERSION }}-${{ hashFiles('build-frida-gum.sh') }}

      - name: Build frida-gum devkit
        if: steps.frida-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}/ndk/$NDK_VERSION"
          echo "NDK: $ANDROID_NDK_ROOT"
          git clone --depth 1 --branch "$FRIDA_VERSION" --recurse-submodules \
            https://github.com/frida/frida.git frida
          ./build-frida-gum.sh frida .
          du -sh app/src/main/libs/*

      - name: Check devkit files
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f "app/src/main/libs/$abi/libfrida-gumjs.a" \
              || { echo "missing libfrida-gumjs.a for $abi"; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Build scripts
        working-directory: scripts
        run: |
          npm ci
          npm run vendor
          npm run build:all

      - name: Grant execution permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: fkiab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
